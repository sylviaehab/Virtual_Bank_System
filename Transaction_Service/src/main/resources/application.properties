# ===================================================
# APPLICATION IDENTITY
# ===================================================

spring.application.name=Transaction_Service

server.port=8083


# ===================================================
# MYSQL DATASOURCE CONFIGURATION
# ===================================================

spring.datasource.url=jdbc:mysql://localhost:3306/transaction_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=salvov@2004

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================

# Change to update first time to create tables
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.defer-datasource-initialization=true


# ===================================================
# LOGGING
# ===================================================

logging.level.org.hibernate.SQL=debug

logging.level.com.example.Transaction_Service=debug


# ===================================================
# ACCOUNT SERVICE (Feign)
# ===================================================

account-service.url=http://localhost:8082


# ===================================================
# FEIGN CONFIGURATION
# ===================================================

feign.circuitbreaker.enabled=true


# ===================================================
# EUREKA CLIENT CONFIGURATION
# ===================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true