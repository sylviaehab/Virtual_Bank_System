spring.application.name=Transaction_Service
# ===================================================
# APPLICATION IDENTITY
# ===================================================

server.port=8083

# ===================================================
# MYSQL DATASOURCE CONFIGURATION
# ===================================================
spring.datasource.url=jdbc:mysql://localhost:3306/transaction_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# ===================================================
# LOGGING
# ===================================================
logging.level.org.hibernate.SQL=debug
logging.level.com.example.Transaction_Service=debug

# ===================================================
# ACCOUNT SERVICE (Feign) - will be replaced once Account Service is deployed
# ===================================================
account-service.url=http://localhost:8082

# ===================================================
# FEIGN CONFIGURATION - enable fallback support
# ===================================================
feign.circuitbreaker.enabled=true